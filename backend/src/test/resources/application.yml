spring:
  application:
    name: ossdoctor

  profiles:
    active: test

  # 테스트용 H2 인메모리 데이터베이스
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway 비활성화 (테스트용)
  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret

jwt:
  secret:
    key: test-jwt-secret-key-for-testing-purposes-only-32chars

app:
  frontend:
    url: http://localhost:5173

github:
  token: test-token
  api:
    base-url: https://api.github.com
    graphql-url: https://api.github.com/graphql
    rate-limit-max-retries: 3
    cache-expiry-minutes: 10
    timeout-seconds: 30
